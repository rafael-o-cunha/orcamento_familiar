<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="536" font-family="Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 760 536" role="img" aria-label="Regras ficam no Business; a View só conhece DTOs" font-size="13"><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="arq-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B9B7AC"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="#1F1E1C">Regras ficam no Business; a View só conhece DTOs</text><g fill="none" stroke="#B9B7AC" stroke-width="1.25"><path d="M234 112V136" marker-end="url(#arq-arrow)"></path><path d="M234 192V216" marker-end="url(#arq-arrow)"></path><path d="M234 272V296" marker-end="url(#arq-arrow)"></path><path d="M234 352V376" marker-end="url(#arq-arrow)"></path><path d="M234 432V456" marker-end="url(#arq-arrow)"></path></g><g><rect x="24" y="56" width="420" height="56" rx="8" fill="none" fill-opacity="1" stroke="#B9B7AC" stroke-width="1.25"></rect><text x="40" y="80" font-weight="600" fill="#1F1E1C">XHTML (JSF + PrimeFaces 5.2)</text><text x="40" y="98" font-size="11.5" fill="#62615B">lancamentos.xhtml, saldos.xhtml, parametros.xhtml</text></g><g><rect x="24" y="136" width="420" height="56" rx="8" fill="none" fill-opacity="1" stroke="#B9B7AC" stroke-width="1.25"></rect><text x="40" y="160" font-weight="600" fill="#1F1E1C">View (managed bean)</text><text x="40" y="178" font-size="11.5" fill="#62615B">LancamentoView: estado da tela, botões, dialogs, mensagens</text></g><g><rect x="24" y="216" width="420" height="56" rx="8" fill="none" fill-opacity="1" stroke="#B9B7AC" stroke-width="1.25"></rect><text x="40" y="240" font-weight="600" fill="#1F1E1C">Controller</text><text x="40" y="258" font-size="11.5" fill="#62615B">LancamentoController: bypass, só repassa ao Business</text></g><g><rect x="24" y="296" width="420" height="56" rx="8" fill="#2F7FD8" fill-opacity="0.12" stroke="#2F7FD8" stroke-width="2"></rect><text x="40" y="320" font-weight="600" fill="#1F1E1C">Business</text><text x="40" y="338" font-size="11.5" fill="#1F1E1C">LancamentoBusiness: regras, transação, locks, Entity ↔ Model</text></g><g><rect x="24" y="376" width="420" height="56" rx="8" fill="none" fill-opacity="1" stroke="#B9B7AC" stroke-width="1.25"></rect><text x="40" y="400" font-weight="600" fill="#1F1E1C">DAO</text><text x="40" y="418" font-size="11.5" fill="#62615B">LancamentoDAO: SQL nativo, find/persist/merge, paginação</text></g><g><rect x="24" y="456" width="420" height="56" rx="8" fill="none" fill-opacity="1" stroke="#B9B7AC" stroke-width="1.25"></rect><text x="40" y="480" font-weight="600" fill="#1F1E1C">Oracle</text><text x="40" y="498" font-size="11.5" fill="#62615B">TB_LANCAMENTO, TB_ANEXO, TB_SALDO_CONTROLE e demais</text></g><text x="246" y="128" font-size="11.5" fill="#62615B">EL e ações AJAX</text><text x="246" y="208" font-size="11.5" fill="#62615B">Filtro / Model</text><text x="246" y="288" font-size="11.5" fill="#62615B">repassa sem regra</text><text x="246" y="368" font-size="11.5" fill="#62615B">Entity / Filtro</text><text x="246" y="448" font-size="11.5" fill="#62615B">JDBC via Hibernate</text><g fill="none" stroke="#B9B7AC" stroke-width="1.25" stroke-dasharray="4 4"><path d="M444 164H456V316H444"></path><path d="M456 244H476"></path></g><g><rect x="476" y="200" width="260" height="88" rx="8" fill="none" stroke="#B9B7AC" stroke-width="1.25"></rect><text x="492" y="224" font-weight="600" fill="#1F1E1C">DTOs entre View e Business</text><text x="492" y="244" font-size="11.5" fill="#62615B">*Filtro: critérios de pesquisa</text><text x="492" y="260" font-size="11.5" fill="#62615B">*Model: dados de um registro</text><text x="492" y="276" font-size="11.5" fill="#62615B">*Helper: dados calculados</text></g><g fill="none" stroke="#B9B7AC" stroke-width="1.25" stroke-dasharray="4 4"><path d="M444 332H456V404H444"></path><path d="M456 368H476"></path></g><g><rect x="476" y="340" width="260" height="56" rx="8" fill="none" stroke="#B9B7AC" stroke-width="1.25"></rect><text x="492" y="364" font-weight="600" fill="#1F1E1C">Entidades JPA</text><text x="492" y="382" font-size="11.5" fill="#62615B">só circulam entre Business e DAO</text></g></svg>
